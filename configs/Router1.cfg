!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX15241KD7-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 10.0.23.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 10.0.10.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.0.200.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 10.0.201.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.40
 encapsulation dot1Q 40
 ip address 10.0.40.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.50
 encapsulation dot1Q 50
 ip address 10.0.50.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface Serial0/0/0
 ip address 10.0.22.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/0/1
 ip address 10.0.24.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/1/0
 ip address 10.0.21.1 255.255.255.252
!
interface Serial0/1/1
 ip address 10.0.16.1 255.255.255.252
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 network 10.0.16.0 0.0.0.3 area 0
 network 10.0.21.0 0.0.0.3 area 0
 network 10.0.22.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.10.0 0.0.0.255 area 0
 network 10.1.0.0 0.0.255.255 area 0
 network 10.0.40.0 0.0.0.255 area 0
 network 10.0.50.0 0.0.0.255 area 0
 network 10.0.200.0 0.0.0.255 area 0
 network 10.0.201.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
