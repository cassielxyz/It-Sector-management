!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
ip dhcp excluded-address 10.0.100.1 10.0.100.49
!
ip dhcp pool IoT_Local_Pool
 network 10.0.100.0 255.255.255.0
 default-router 10.0.100.1
 dns-server 10.0.15.11
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX15248XAT-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 10.0.28.2 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 10.0.15.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.100
 encapsulation dot1Q 100
 ip address 10.0.100.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface Serial0/0/0
 ip address 10.0.20.2 255.255.255.0
!
interface Serial0/0/1
 ip address 10.0.30.2 255.255.255.0
 clock rate 2000000
!
interface Serial0/1/0
 ip address 10.0.25.2 255.255.255.0
 clock rate 2000000
!
interface Serial0/1/1
 ip address 10.0.21.2 255.255.255.0
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 network 10.0.15.0 0.0.0.255 area 0
 network 10.0.20.0 0.0.0.255 area 0
 network 10.0.21.0 0.0.0.255 area 0
 network 10.0.25.0 0.0.0.255 area 0
 network 10.0.28.0 0.0.0.255 area 0
 network 10.0.30.0 0.0.0.255 area 0
 network 10.0.100.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
