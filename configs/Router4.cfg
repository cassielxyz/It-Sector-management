!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX15245MN7-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface Loopback99
 no ip address
 shutdown
!
interface GigabitEthernet0/0
 ip address 10.0.26.2 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.1
 encapsulation dot1Q 1 native
 ip address 10.0.14.1 255.255.255.0
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 10.5.10.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.5.20.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 10.5.30.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.118
 encapsulation dot1Q 118
 ip address 10.0.118.1 255.255.255.0
!
interface Serial0/0/0
 ip address 10.0.29.2 255.255.255.252
!
interface Serial0/0/1
 ip address 10.0.24.2 255.255.255.252
!
interface Serial0/1/0
 ip address 10.0.19.2 255.255.255.252
!
interface Serial0/1/1
 ip address 10.0.20.1 255.255.255.252
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 5.5.5.5
 log-adjacency-changes
 network 10.0.19.0 0.0.0.3 area 0
 network 10.0.20.0 0.0.0.3 area 0
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.26.0 0.0.0.3 area 0
 network 10.0.29.0 0.0.0.3 area 0
 network 10.0.14.0 0.0.0.255 area 0
 network 10.5.0.0 0.0.255.255 area 0
 network 10.0.118.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
access-list 10 permit host 10.0.118.10
access-list 10 deny any
!
!
!
!
snmp-server community [REDACTED] RO
!
logging 10.0.118.11
line con 0
!
line aux 0
!
line vty 0 4
 access-class 10 in
 login
!
!
!
end
