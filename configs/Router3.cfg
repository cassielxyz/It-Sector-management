!
interface GigabitEthernet0/0
 ip address 10.0.28.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.110
 encapsulation dot1Q 110
 no ip address
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.1
 encapsulation dot1Q 1 native
 no ip address
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 10.3.10.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.3.20.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 10.3.30.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.105
 encapsulation dot1Q 105
 ip address 10.0.105.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.106
 encapsulation dot1Q 106
 ip address 10.0.106.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.107
 encapsulation dot1Q 107
 ip address 10.0.107.1 255.255.255.0
 ip helper-address 10.0.15.10
 ip access-group HR_STRICT_IN in
 ip access-group CEO_AND_SERVER_ONLY out
!
interface GigabitEthernet0/1.108
 encapsulation dot1Q 108
 ip address 10.0.108.1 255.255.255.0
 ip helper-address 10.0.15.10
 ip access-group FIN_STRICT_IN in
 ip access-group CEO_AND_SERVER_ONLY out
!
interface GigabitEthernet0/1.109
 encapsulation dot1Q 109
 ip address 10.0.109.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.110
 encapsulation dot1Q 110
 ip address 10.0.110.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface Serial0/0/0
 ip address 10.0.22.2 255.255.255.252
!
interface Serial0/0/1
 ip address 10.0.29.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/1/0
 ip address 10.0.17.2 255.255.255.252
!
interface Serial0/1/1
 ip address 10.0.18.1 255.255.255.252
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 network 10.0.17.0 0.0.0.3 area 0
 network 10.0.18.0 0.0.0.3 area 0
 network 10.0.22.0 0.0.0.3 area 0
 network 10.0.28.0 0.0.0.3 area 0
 network 10.0.29.0 0.0.0.3 area 0
 network 10.0.12.0 0.0.0.255 area 0
 network 10.3.0.0 0.0.255.255 area 0
 network 10.0.105.0 0.0.0.255 area 0
 network 10.0.106.0 0.0.0.255 area 0
 network 10.0.107.0 0.0.0.255 area 0
 network 10.0.108.0 0.0.0.255 area 0
 network 10.0.110.0 0.0.0.255 area 0
 network 10.3.30.0 0.0.0.255 area 0
 network 10.0.109.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended HR_STRICT_IN
 permit ip 10.0.107.0 0.0.0.255 10.0.15.0 0.0.0.255
 permit ip 10.0.107.0 0.0.0.255 host 10.3.0.10
 permit udp any any eq bootps
 permit udp any any eq bootpc
ip access-list extended FIN_STRICT_IN
 permit ip 10.0.108.0 0.0.0.255 10.0.15.0 0.0.0.255
 permit ip 10.0.108.0 0.0.0.255 host 10.3.0.10
 permit udp any any eq bootps
 permit udp any any eq bootpc
ip access-list extended CEO_AND_SERVER_ONLY
 permit ip 10.0.15.0 0.0.0.255 10.0.107.0 0.0.0.255
 permit ip 10.0.15.0 0.0.0.255 10.0.108.0 0.0.0.255
 permit ip 10.3.0.0 0.0.0.255 10.0.107.0 0.0.0.255
 permit ip 10.3.0.0 0.0.0.255 10.0.108.0 0.0.0.255
 permit ip 10.0.15.0 0.0.0.255 10.3.0.0 0.0.0.255
ip access-list extended IOT_RESTRICTED
 permit udp any eq bootps any
 permit udp any any eq bootpc
 permit ip host 10.0.15.10 10.0.100.0 0.0.0.255
 permit ip 10.0.100.0 0.0.0.255 host 10.0.15.10
 permit ip 10.3.30.0 0.0.0.255 10.0.100.0 0.0.0.255
 permit ip 10.3.0.0 0.0.0.255 10.0.100.0 0.0.0.255
 deny ip any 10.0.100.0 0.0.0.255
!
