!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
ip dhcp excluded-address 10.2.80.1 10.2.80.2
ip dhcp excluded-address 10.2.80.11
!
ip dhcp pool FLOOR_11_VOICE_LOCAL
 network 10.2.80.0 255.255.255.0
 default-router 10.2.80.1
 option 150 ip 10.2.80.2
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX1524IC34-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 10.0.26.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.70
 encapsulation dot1Q 70
 ip address 10.2.9.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.75
 encapsulation dot1Q 75
 ip address 10.2.10.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.80
 encapsulation dot1Q 80
 ip address 10.2.80.1 255.255.255.0
!
interface GigabitEthernet0/1.98
 encapsulation dot1Q 98
 ip address 10.2.11.1 255.255.255.0
 ip helper-address 10.0.15.10
 ip helper-address 10.0.15.11
!
interface GigabitEthernet0/1.99
 encapsulation dot1Q 99
 ip address 10.2.12.1 255.255.255.0
 ip helper-address 10.0.15.10
 ip helper-address 10.0.15.11
!
interface Serial0/0/0
 ip address 10.0.17.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/0/1
 ip address 10.0.27.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/1/0
 ip address 10.0.25.1 255.255.255.252
!
interface Serial0/1/1
 ip address 10.0.16.2 255.255.255.252
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 10.0.16.0 0.0.0.3 area 0
 network 10.0.17.0 0.0.0.3 area 0
 network 10.0.25.0 0.0.0.3 area 0
 network 10.0.26.0 0.0.0.3 area 0
 network 10.0.27.0 0.0.0.3 area 0
 network 10.2.0.0 0.0.255.255 area 0
 network 10.0.11.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
