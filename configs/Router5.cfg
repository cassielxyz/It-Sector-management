!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
!
!
!
!
no ip cef
ipv6 unicast-routing
!
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX1524N7Z4-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 10.0.23.2 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 10.0.13.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.115
 encapsulation dot1Q 115
 ip address 10.0.115.1 255.255.255.0
 ip helper-address 10.0.15.10
!
interface GigabitEthernet0/1.116
 encapsulation dot1Q 116
 no ip address
 ipv6 traffic-filter IPV6_DMZ_SECURITY in
 ipv6 address 2001:DB8:ACAD:116::1/64
 ipv6 enable
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/1.998
 encapsulation dot1Q 998
 ip address 10.0.254.1 255.255.255.0
 ip access-group DMZ_SECURITY in
!
interface Serial0/0/0
 ip address 10.0.30.1 255.255.255.252
!
interface Serial0/0/1
 ip address 10.0.27.2 255.255.255.252
!
interface Serial0/1/0
 ip address 10.0.18.2 255.255.255.252
!
interface Serial0/1/1
 ip address 10.0.19.1 255.255.255.252
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.18.0 0.0.0.3 area 0
 network 10.0.19.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 10.0.27.0 0.0.0.3 area 0
 network 10.0.30.0 0.0.0.3 area 0
 network 10.4.0.0 0.0.255.255 area 0
 network 10.0.115.0 0.0.0.255 area 0
 network 10.0.254.0 0.0.0.255 area 0
 network 10.0.116.0 0.0.0.255 area 0
!
ipv6 router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended DMZ_SECURITY
 permit tcp 10.0.254.0 0.0.0.255 10.0.0.0 0.255.255.255 established
 deny ip 10.0.254.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip any any
ipv6 access-list IPV6_DMZ_SECURITY
 permit tcp 2001:DB8:ACAD:116::/64 any
 deny ipv6 2001:DB8:ACAD:116::/64 any
 permit ipv6 any any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
